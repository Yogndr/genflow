# Test database - in-memory H2
spring.datasource.url=jdbc:h2:mem:genflowtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test-only configuration
jwt.secret=test-secret-key-for-genflow-ci-testing-only-12345678901234567890

gemini.api.key=test-gemini-api-key

huggingface.api.token=test-huggingface-token

cloudinary.cloud-name=test-cloud-name
cloudinary.api-key=test-cloudinary-api-key
cloudinary.api-secret=test-cloudinary-api-secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generation-worker
  template:
    metadata:
      labels:
        app: generation-worker
    spec:
      containers:
        - name: generation-worker
          image: genflow-generation-worker:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: RABBITMQ_HOST
              value: "host.docker.internal"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "host.docker.internal:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: generation-worker-service
spec:
  selector:
    app: generation-worker
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP